name: dossier
description: "The Dossier — Your Life. Your Wealth. Your Legacy. End-to-end encrypted life, wealth and legacy records."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  cloud_functions: ^6.0.0

  # Cryptography (AES-256-GCM, Argon2id, X25519, HKDF, SHA-256)
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2

  # Device key storage + biometric unlock
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

  # App
  provider: ^6.1.2
  intl: '>=0.19.0 <0.21.0'
  uuid: ^4.5.1
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6
  flutter_local_notifications: 22.3.3
  web: ^1.1.1
  timezone: ^0.11.2
  firebase_messaging: ^16.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/brand/

flutter_launcher_icons:
  image_path: "assets/brand/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#111D2F"
  adaptive_icon_foreground: "assets/brand/app_icon_adaptive.png"
  web:
    generate: true
    image_path: "assets/brand/app_icon.png"
    background_color: "#0B1422"
    theme_color: "#0B1422"
